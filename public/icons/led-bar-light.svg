<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 160" width="256" height="160" role="img" aria-label="LED bar light icon">

  <!-- Shadow -->
  <rect x="34" y="54" width="188" height="54" rx="16" fill="#000" opacity="0.08"></rect>

  <!-- Lamp body -->
  <rect x="30" y="50" width="196" height="54" rx="16" fill="#E6EAEE"></rect>
  <rect x="40" y="58" width="176" height="38" rx="12" fill="#000" opacity="0.06"></rect>

  <!-- Warm glow halo -->
  <rect x="44" y="60" width="168" height="34" rx="12" fill="#FFD966" opacity="0.35"></rect>

  <!-- Diffuser -->
  <rect x="46" y="62" width="164" height="30" rx="10" fill="#FFF2B3"></rect>
  <path d="M56 64h120c12 0 22 10 22 22v2H46v-2c0-12 6-22 10-22z" fill="#FFF8D6" opacity="0.75"></path>

  <!-- LED segments -->
  <g fill="#FFE066">
    <rect x="56" y="71" width="18" height="12" rx="6"></rect>
    <rect x="78" y="71" width="18" height="12" rx="6"></rect>
    <rect x="100" y="71" width="18" height="12" rx="6"></rect>
    <rect x="122" y="71" width="18" height="12" rx="6"></rect>
    <rect x="144" y="71" width="18" height="12" rx="6"></rect>
    <rect x="166" y="71" width="18" height="12" rx="6"></rect>
  </g>

  <!-- End caps -->
  <g>
    <rect x="30" y="50" width="22" height="54" rx="16" fill="#D8DDE2"></rect>
    <rect x="204" y="50" width="22" height="54" rx="16" fill="#D8DDE2"></rect>
    <rect x="34" y="58" width="14" height="38" rx="10" fill="#000" opacity="0.08"></rect>
    <rect x="208" y="58" width="14" height="38" rx="10" fill="#000" opacity="0.08"></rect>
  </g>

  <!-- Mounting holes -->
  <g fill="#9AA0A6">
    <circle cx="42" cy="77" r="4"></circle>
    <circle cx="214" cy="77" r="4"></circle>
  </g>

  <!-- Subtle light rays (controlled, schematic) -->
  <g stroke="#FFD966" opacity="0.4" stroke-width="3" stroke-linecap="round">
    <line x1="128" y1="36" x2="128" y2="28"></line>
    <line x1="96" y1="40" x2="88" y2="32"></line>
    <line x1="160" y1="40" x2="168" y2="32"></line>
  </g>

</svg>
