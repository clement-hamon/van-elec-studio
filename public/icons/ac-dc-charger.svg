<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 384" width="256" height="384" role="img" aria-label="Victron MultiPlus vertical icon">

  <!-- Shadow -->
  <rect x="60" y="22" width="136" height="340" rx="22" fill="#000" opacity="0.08"></rect>

  <!-- Main housing -->
  <rect x="56" y="18" width="144" height="340" rx="22" fill="#2F86C8"></rect>

  <!-- Inner panel -->
  <rect x="66" y="28" width="124" height="320" rx="18" fill="#000" opacity="0.06"></rect>

  <!-- Side mounting ears -->
  <g fill="#2F86C8">
    <rect x="34" y="80" width="22" height="34" rx="8"></rect>
    <rect x="34" y="270" width="22" height="34" rx="8"></rect>
    <rect x="200" y="80" width="22" height="34" rx="8"></rect>
    <rect x="200" y="270" width="22" height="34" rx="8"></rect>
  </g>

  <!-- Mounting holes -->
  <g fill="#1E5E90">
    <circle cx="45" cy="97" r="5"></circle>
    <circle cx="45" cy="287" r="5"></circle>
    <circle cx="211" cy="97" r="5"></circle>
    <circle cx="211" cy="287" r="5"></circle>
  </g>

  <!-- Top branding block -->
  <rect x="92" y="48" width="72" height="10" rx="5" fill="#FFF" opacity="0.22"></rect>

  <!-- Product name block -->
  <rect x="86" y="66" width="84" height="14" rx="7" fill="#FFF" opacity="0.32"></rect>

  <!-- Model block -->
  <rect x="96" y="86" width="64" height="10" rx="5" fill="#FFF" opacity="0.22"></rect>

  <!-- Orange accent stripe -->
  <rect x="82" y="110" width="92" height="10" rx="5" fill="#F06A1A"></rect>

  <!-- Certification icons row (abstract) -->
  <g fill="#FFF" opacity="0.22">
    <rect x="90" y="128" width="18" height="12" rx="3"></rect>
    <rect x="112" y="128" width="18" height="12" rx="3"></rect>
    <rect x="134" y="128" width="18" height="12" rx="3"></rect>
  </g>

  <!-- Front panel empty area (flat look) -->
  <rect x="78" y="150" width="100" height="140" rx="12" fill="#2A75AF" opacity="0.35"></rect>

  <!-- Status LED panel -->
  <g>
    <rect x="112" y="304" width="32" height="26" rx="8" fill="#1E5E90"></rect>
    <circle cx="128" cy="317" r="5.5" fill="#4CE36B"></circle>
    <circle cx="128" cy="317" r="11" fill="#4CE36B" opacity="0.15"></circle>
  </g>

  <!-- Bottom connectors -->
  <g>
    <!-- AC / DC blocks -->
    <rect x="74" y="340" width="36" height="18" rx="4" fill="#1A1A1A"></rect>
    <rect x="114" y="340" width="28" height="18" rx="4" fill="#1A1A1A"></rect>
    <rect x="146" y="340" width="36" height="18" rx="4" fill="#1A1A1A"></rect>

    <!-- Connector details -->
    <rect x="80" y="344" width="24" height="8" rx="2" fill="#000" opacity="0.35"></rect>
    <rect x="118" y="344" width="20" height="8" rx="2" fill="#000" opacity="0.35"></rect>
    <rect x="152" y="344" width="24" height="8" rx="2" fill="#000" opacity="0.35"></rect>
  </g>

</svg>
