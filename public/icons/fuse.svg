<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" width="160" height="80" role="img" aria-label="Electrical fuse icon">

  <!-- Shadow -->
  <rect x="10" y="18" width="140" height="36" rx="8" fill="#000" opacity="0.08"></rect>

  <!-- Fuse body -->
  <rect x="6" y="14" width="148" height="36" rx="8" fill="#2F86C8"></rect>

  <!-- Inner recess -->
  <rect x="14" y="20" width="132" height="24" rx="6" fill="#000" opacity="0.08"></rect>

  <!-- Fuse window -->
  <rect x="46" y="22" width="68" height="20" rx="4" fill="#1E5E90"></rect>

  <!-- Fuse element -->
  <path d="M52 32
           h14
           c6 0 6-6 12-6
           s6 6 12 6
           h14" fill="none" stroke="#F2C94C" stroke-width="3" stroke-linecap="round"></path>

  <!-- Contact blades -->
  <rect x="0" y="26" width="12" height="12" rx="2" fill="#BDBDBD"></rect>
  <rect x="148" y="26" width="12" height="12" rx="2" fill="#BDBDBD"></rect>

  <!-- Contact highlights -->
  <rect x="2" y="28" width="8" height="8" rx="1.5" fill="#E0E0E0" opacity="0.6"></rect>
  <rect x="150" y="28" width="8" height="8" rx="1.5" fill="#E0E0E0" opacity="0.6"></rect>

</svg>
