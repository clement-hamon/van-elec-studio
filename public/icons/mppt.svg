<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="MPPT charge controller icon">
  <!-- Soft shadow -->
  <rect x="22" y="18" width="212" height="224" rx="26" fill="#000" opacity="0.08"></rect>

  <!-- Main housing -->
  <rect x="18" y="14" width="212" height="224" rx="26" fill="#2F86C8"></rect>
  <!-- Inner lip (subtle) -->
  <rect x="28" y="24" width="192" height="204" rx="22" fill="#000" opacity="0.06"></rect>

  <!-- Corner mount holes -->
  <g opacity="0.85">
    <circle cx="40" cy="36" r="10" fill="#1C5E92"></circle>
    <circle cx="208" cy="36" r="10" fill="#1C5E92"></circle>
    <circle cx="40" cy="214" r="10" fill="#1C5E92"></circle>
    <circle cx="208" cy="214" r="10" fill="#1C5E92"></circle>
    <circle cx="40" cy="36" r="6.5" fill="#0E3F63"></circle>
    <circle cx="208" cy="36" r="6.5" fill="#0E3F63"></circle>
    <circle cx="40" cy="214" r="6.5" fill="#0E3F63"></circle>
    <circle cx="208" cy="214" r="6.5" fill="#0E3F63"></circle>
  </g>

  <!-- Top label area (stylized, not exact branding) -->
  <rect x="56" y="36" width="98" height="10" rx="5" fill="#fff" opacity="0.22"></rect>
  <rect x="56" y="52" width="120" height="18" rx="9" fill="#fff" opacity="0.35"></rect>
  <rect x="56" y="76" width="90" height="26" rx="10" fill="#fff" opacity="0.45"></rect>

  <!-- Orange stripe -->
  <rect x="56" y="112" width="144" height="12" rx="6" fill="#F06A1A"></rect>

  <!-- Mid icons/marks (abstract blocks) -->
  <g fill="#fff" opacity="0.26">
    <rect x="56" y="136" width="28" height="18" rx="4"></rect>
    <rect x="90" y="136" width="22" height="18" rx="4"></rect>
    <rect x="118" y="136" width="44" height="18" rx="4"></rect>
    <rect x="168" y="136" width="32" height="18" rx="4"></rect>
  </g>

  <!-- Bottom info lines -->
  <g fill="#fff" opacity="0.22">
    <rect x="56" y="164" width="144" height="6" rx="3"></rect>
    <rect x="56" y="176" width="120" height="6" rx="3"></rect>
    <rect x="56" y="188" width="98" height="6" rx="3"></rect>
  </g>

  <!-- LED column (right) -->
  <g>
    <circle cx="206" cy="170" r="4.8" fill="#1E6E3E" opacity="0.55"></circle>
    <circle cx="206" cy="184" r="4.8" fill="#C6A21A" opacity="0.55"></circle>
    <circle cx="206" cy="198" r="6.2" fill="#7FDBFF" opacity="0.9"></circle>
    <circle cx="206" cy="198" r="10" fill="#7FDBFF" opacity="0.12"></circle>
  </g>

  <!-- Terminal block area -->
  <rect x="62" y="196" width="132" height="42" rx="14" fill="#2B79B6"></rect>
  <rect x="70" y="204" width="116" height="26" rx="10" fill="#1E5E90" opacity="0.55"></rect>

  <!-- Terminal screws -->
  <g>
    <!-- six screws -->
    <g fill="#0F2E46" opacity="0.9">
      <circle cx="84" cy="217" r="7.2"></circle>
      <circle cx="104" cy="217" r="7.2"></circle>
      <circle cx="124" cy="217" r="7.2"></circle>
      <circle cx="144" cy="217" r="7.2"></circle>
      <circle cx="164" cy="217" r="7.2"></circle>
      <circle cx="184" cy="217" r="7.2"></circle>
    </g>
    <!-- screw highlights -->
    <g fill="#fff" opacity="0.18">
      <circle cx="82.5" cy="215.5" r="2.2"></circle>
      <circle cx="102.5" cy="215.5" r="2.2"></circle>
      <circle cx="122.5" cy="215.5" r="2.2"></circle>
      <circle cx="142.5" cy="215.5" r="2.2"></circle>
      <circle cx="162.5" cy="215.5" r="2.2"></circle>
      <circle cx="182.5" cy="215.5" r="2.2"></circle>
    </g>
    <!-- screw slots -->
    <g stroke="#000" opacity="0.35" stroke-width="1.6" stroke-linecap="round">
      <line x1="79" y1="217" x2="89" y2="217"></line>
      <line x1="99" y1="217" x2="109" y2="217"></line>
      <line x1="119" y1="217" x2="129" y2="217"></line>
      <line x1="139" y1="217" x2="149" y2="217"></line>
      <line x1="159" y1="217" x2="169" y2="217"></line>
      <line x1="179" y1="217" x2="189" y2="217"></line>
    </g>
  </g>

  <!-- Terminal labels (simple, brand-agnostic) -->
  <g fill="#fff" opacity="0.55" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700">
    <text x="74" y="202">BATT</text>
    <text x="125" y="202">PV</text>
    <text x="169" y="202">LOAD</text>
  </g>

  <!-- +/- marks -->
  <g fill="#fff" opacity="0.55" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700">
    <text x="80" y="241">+</text>
    <text x="100" y="241">−</text>
    <text x="120" y="241">−</text>
    <text x="140" y="241">+</text>
    <text x="160" y="241">−</text>
    <text x="180" y="241">+</text>
  </g>
</svg>
