<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Shore power inlet icon">

  <!-- Shadow -->
  <circle cx="84" cy="86" r="60" fill="#000" opacity="0.08"></circle>

  <!-- Outer flange -->
  <circle cx="80" cy="82" r="60" fill="#2F86C8"></circle>
  <circle cx="80" cy="82" r="52" fill="#000" opacity="0.08"></circle>

  <!-- Inner bezel -->
  <circle cx="80" cy="82" r="44" fill="#1E5E90"></circle>

  <!-- Plug cavity -->
  <circle cx="80" cy="82" r="32" fill="#0F3F66"></circle>

  <!-- Connector pins -->
  <g fill="#BDBDBD">
    <!-- earth -->
    <circle cx="80" cy="64" r="5"></circle>
    <!-- live / neutral -->
    <circle cx="66" cy="92" r="5"></circle>
    <circle cx="94" cy="92" r="5"></circle>
  </g>

  <!-- Pin holes -->
  <g fill="#5E5E5E">
    <circle cx="80" cy="64" r="2.2"></circle>
    <circle cx="66" cy="92" r="2.2"></circle>
    <circle cx="94" cy="92" r="2.2"></circle>
  </g>

  <!-- Pin highlights -->
  <g fill="#FFF" opacity="0.18">
    <circle cx="78.5" cy="62.5" r="1.6"></circle>
    <circle cx="64.5" cy="90.5" r="1.6"></circle>
    <circle cx="92.5" cy="90.5" r="1.6"></circle>
  </g>

  <!-- Mounting screw holes -->
  <g fill="#1A1A1A" opacity="0.75">
    <circle cx="80" cy="26" r="4"></circle>
    <circle cx="80" cy="138" r="4"></circle>
    <circle cx="26" cy="82" r="4"></circle>
    <circle cx="134" cy="82" r="4"></circle>
  </g>

  <!-- Screw highlights -->
  <g fill="#FFF" opacity="0.15">
    <circle cx="78.5" cy="24.5" r="1.6"></circle>
    <circle cx="78.5" cy="136.5" r="1.6"></circle>
    <circle cx="24.5" cy="80.5" r="1.6"></circle>
    <circle cx="132.5" cy="80.5" r="1.6"></circle>
  </g>

</svg>
