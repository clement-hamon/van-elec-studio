<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 320" width="256" height="320" role="img" aria-label="12V fuse box icon">

  <!-- Shadow -->
  <rect x="44" y="34" width="168" height="252" rx="16" fill="#000" opacity="0.08"></rect>

  <!-- Main housing -->
  <rect x="40" y="30" width="176" height="252" rx="16" fill="#2A2E33"></rect>
  <rect x="50" y="40" width="156" height="232" rx="12" fill="#000" opacity="0.10"></rect>

  <!-- Top bus bar area -->
  <rect x="56" y="48" width="144" height="44" rx="8" fill="#3A4046"></rect>

  <!-- Bus screws -->
  <g fill="#B0B6BC">
    <circle cx="72" cy="70" r="6"></circle>
    <circle cx="92" cy="70" r="6"></circle>
    <circle cx="112" cy="70" r="6"></circle>
    <circle cx="132" cy="70" r="6"></circle>
    <circle cx="152" cy="70" r="6"></circle>
    <circle cx="172" cy="70" r="6"></circle>
  </g>

  <!-- Positive / Negative studs -->
  <circle cx="64" cy="56" r="8" fill="#B0B6BC"></circle>
  <circle cx="192" cy="56" r="8" fill="#B0B6BC"></circle>

  <!-- Fuse grid background -->
  <rect x="56" y="104" width="144" height="160" rx="10" fill="#1E2328"></rect>

  <!-- Fuses (2 columns x 5 rows, muted colors) -->
  <g opacity="0.85">
    <!-- Row 1 -->
    <rect x="70" y="116" width="40" height="16" rx="4" fill="#C05A5A"></rect>
    <rect x="146" y="116" width="40" height="16" rx="4" fill="#4F7FAF"></rect>

    <!-- Row 2 -->
    <rect x="70" y="146" width="40" height="16" rx="4" fill="#C9B458"></rect>
    <rect x="146" y="146" width="40" height="16" rx="4" fill="#C9B458"></rect>

    <!-- Row 3 -->
    <rect x="70" y="176" width="40" height="16" rx="4" fill="#4F7FAF"></rect>
    <rect x="146" y="176" width="40" height="16" rx="4" fill="#C05A5A"></rect>

    <!-- Row 4 -->
    <rect x="70" y="206" width="40" height="16" rx="4" fill="#C9B458"></rect>
    <rect x="146" y="206" width="40" height="16" rx="4" fill="#D08A4C"></rect>

    <!-- Row 5 -->
    <rect x="70" y="236" width="40" height="16" rx="4" fill="#D08A4C"></rect>
    <rect x="146" y="236" width="40" height="16" rx="4" fill="#C9B458"></rect>
  </g>

  <!-- Small LED indicators -->
  <g fill="#A33E3E" opacity="0.7">
    <circle cx="128" cy="124" r="3"></circle>
    <circle cx="128" cy="154" r="3"></circle>
    <circle cx="128" cy="184" r="3"></circle>
    <circle cx="128" cy="214" r="3"></circle>
    <circle cx="128" cy="244" r="3"></circle>
  </g>

  <!-- Bottom mounting holes -->
  <g fill="#111">
    <circle cx="60" cy="274" r="6"></circle>
    <circle cx="196" cy="274" r="6"></circle>
  </g>

</svg>
