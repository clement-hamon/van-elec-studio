<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 64" width="128" height="64" role="img" aria-label="Stripped blue cable icon">

  <!-- Shadow -->
  <rect x="10" y="26" width="108" height="14" rx="7" fill="#000" opacity="0.08"></rect>

  <!-- Insulated cable (blue, left half) -->
  <rect x="8" y="22" width="72" height="14" rx="7" fill="#2F86C8"></rect>

  <!-- Cut edge hint -->
  <rect x="76" y="22" width="6" height="14" rx="3" fill="#000" opacity="0.12"></rect>

  <!-- Exposed copper (right half) -->
  <g>
    <rect x="82" y="25" width="40" height="8" rx="4" fill="#B07B3A"></rect>
    <rect x="82" y="25" width="40" height="8" rx="4" fill="#FFF" opacity="0.10"></rect>

    <!-- Strand lines -->
    <g stroke="#8A5C2B" stroke-width="1.2" opacity="0.55" stroke-linecap="round">
      <line x1="86" y1="27" x2="116" y2="27"></line>
      <line x1="86" y1="29" x2="116" y2="29"></line>
      <line x1="86" y1="31" x2="116" y2="31"></line>
    </g>
  </g>

  <!-- Subtle insulation taper -->
  <path d="M72 22h10c5 0 5 14 0 14H72c5-3 5-11 0-14z" fill="#2F86C8"></path>

</svg>