<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Battery circuit switch icon">

  <!-- Shadow -->
  <rect x="54" y="54" width="148" height="148" rx="20" fill="#000" opacity="0.08"></rect>

  <!-- Main housing -->
  <rect x="50" y="50" width="156" height="156" rx="20" fill="#2A2E33"></rect>

  <!-- Subtle inner surface -->
  <rect x="62" y="62" width="132" height="132" rx="16" fill="#000" opacity="0.10"></rect>

  <!-- Mounting holes -->
  <g fill="#111">
    <circle cx="72" cy="72" r="10"></circle>
    <circle cx="184" cy="72" r="10"></circle>
    <circle cx="72" cy="184" r="10"></circle>
    <circle cx="184" cy="184" r="10"></circle>
  </g>

  <!-- Rotary knob base ring -->
  <circle cx="128" cy="128" r="56" fill="#1E2328"></circle>

  <!-- Red switch knob -->
  <circle cx="128" cy="128" r="46" fill="#D94B45"></circle>
  <circle cx="128" cy="128" r="46" fill="#FFF" opacity="0.06"></circle>

  <!-- Knob grips -->
  <g fill="#C63E39">
    <path d="M128 82c10 0 18 8 18 18H110c0-10 8-18 18-18z"></path>
    <path d="M174 128c0 10-8 18-18 18v-36c10 0 18 8 18 18z"></path>
    <path d="M128 174c-10 0-18-8-18-18h36c0 10-8 18-18 18z"></path>
    <path d="M82 128c0-10 8-18 18-18v36c-10 0-18-8-18-18z"></path>
  </g>

  <!-- White center cap -->
  <circle cx="128" cy="128" r="24" fill="#F1F3F6"></circle>

  <!-- Battery symbol -->
  <g stroke="#2A2E33" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="110" y="118" width="36" height="20" rx="3"></rect>
    <line x1="116" y1="118" x2="116" y2="112"></line>
    <line x1="140" y1="118" x2="140" y2="112"></line>
  </g>

</svg>
